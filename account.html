<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Account — Syntix.ai</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="logo" href="./">syntix<span>.ai</span></a>
      <nav class="links" aria-label="Main navigation">
        <a href="./tools.html">AI directory</a>
        <a href="./compare.html">Compare</a>
        <a href="../ru/account.html">Русский</a>
      </nav>
    </header>
    <main class="section">
      <section class="card auth-card">
        <h1>Syntix.ai account</h1>
        <p class="muted">Create an account or sign in to use Syntix across devices.</p>
        <div id="signed-in-panel" hidden>
          <p>Signed in as <strong id="user-email"></strong></p>
          <button class="btn" id="logout" type="button">Sign out</button>
        </div>
        <form id="auth-form" class="auth-form">
          <div class="auth-modes">
            <label><input type="radio" name="mode" value="signup" checked> Sign up</label>
            <label><input type="radio" name="mode" value="login"> Sign in</label>
          </div>
          <label>Email
            <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
          </label>
          <label>Password (at least 8 characters)
            <input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
          </label>
          <button class="btn" id="submit-auth" type="submit">Create account</button>
        </form>
        <p id="auth-message" role="status" aria-live="polite"></p>
        <p class="note">You may need to confirm your email after signing up. Use a unique password. Syntix.ai support will never ask you to send your password.</p>
      </section>
    </main>
    <footer class="footer">© 2026 Syntix.ai</footer>
  </div>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script defer src="../config.js"></script>
  <script defer src="../localized-account.js"></script>
</body>
</html>
