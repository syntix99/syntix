<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b13"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2">
<meta name="description" content="Syntix Premium: аналитика, редактирование постов, длинные публикации, сравнение до 6 инструментов и многое другое.">
<title>Premium — Syntix</title>
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./profile.css"><link rel="stylesheet" href="./social.css">
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="./config.js"></script><script defer src="./premium-config.js"></script><script defer src="./premium.js"></script><script defer src="./nav-auth.js"></script><script defer src="./premium-page.js"></script><script defer src="./badge.js"></script><script defer src="./ui.js"></script>
</head>
<body><div class="glow g1"></div><div class="glow g2"></div>
<header class="wrap top"><a class="brand" href="./index.html"><b>S</b> syntix<span>.</span></a><nav><a href="./index.html#catalog" id="nCat">Каталог</a><a href="./feed.html" id="nFeed">Лента</a><a href="./leaderboard.html" id="nTop">Рейтинг</a><a href="./messages.html" id="nMsg">Сообщения</a></nav><div class="actions"><button id="language" type="button">EN</button><a class="btn ghost" href="./account.html">Войти</a></div></header>
<main class="wrap prem-page">
  <section class="prem-hero">
    <small>SYNTIX PREMIUM</small>
    <h1 id="h">💎 Syntix <em>Premium.</em></h1>
    <p id="sub"></p>
    <div id="status"></div>
  </section>
  <section class="price-wrap">
    <div class="pills plan-toggle"><button type="button" class="pill-btn" data-plan="monthly" id="planM"></button><button type="button" class="pill-btn active" data-plan="yearly" id="planY"></button></div>
    <div class="price-card">
      <div class="price"><b id="priceVal"></b><span id="pricePer"></span></div>
      <p class="muted small" id="priceSub"></p>
      <button type="button" class="btn primary big" id="buyBtn"></button>
      <p class="muted small" id="buyNote"></p>
      <p class="muted small" id="uidLine"></p>
    </div>
  </section>
  <section><h2 class="lb-h2" id="featTitle"></h2><div id="featGrid" class="feat-grid"></div></section>
  <section><h2 class="lb-h2" id="cmpTitle"></h2><div class="tablewrap"><table class="comparison"><thead><tr><th id="thF"></th><th id="thFree"></th><th id="thPrem"></th></tr></thead><tbody id="cmpBody"></tbody></table></div></section>
  <section><h2 class="lb-h2" id="faqTitle"></h2><div id="faq" class="faq"></div><p class="muted small" id="contact"></p></section>
</main>
</body>
</html>
